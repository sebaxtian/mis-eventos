[project]
name = "mis-eventos-backend"
version = "1.0.0"
description = "Backend API for Mis Eventos platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "PyJWT>=2.10.1",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
